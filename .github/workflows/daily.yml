name: Deal Hunter

on:
  workflow_dispatch:   # triggered by cron-job.org — no GitHub schedule needed

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal hunter
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY:  ${{ secrets.SCRAPER_API_KEY }}
        run: python deal_hunter.py

      - name: Commit seen.json
        run: |
          git config user.email "bot@deal-hunter"
          git config user.name  "Deal Hunter Bot"
          git add seen.json || true
          git diff --staged --quiet || git commit -m "update seen.json [skip ci]"
          git push
