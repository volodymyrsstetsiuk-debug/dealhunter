name: Deal Monitor

on:
  schedule:
    # Every 10 minutes. GitHub throttles schedules under load — in practice
    # expect runs every 10–15 min, which is plenty fast for deal hunting.
    - cron: "*/10 * * * *"
  workflow_dispatch:  # lets you trigger manually from the Actions tab

# Required so the workflow can commit seen.json back to the repo
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deal_hunter.py

      - name: Commit seen.json
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add seen.json
          # Only commit if there are actual changes; [skip ci] prevents loops
          git diff --staged --quiet || git commit -m "update seen [skip ci]"
          git push
